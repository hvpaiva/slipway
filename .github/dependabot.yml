# Bundler updates arrive weekly as one pull request for minor and patch bumps; a major
# bump gets its own. Action SHAs are refreshed monthly, and Dependabot rewrites the version
# comment next to each SHA. The skip-changelog label exempts these pull requests from the
# CHANGELOG.md check in the commits job: dependency bumps are not user-visible changes.
# The cooldown waits a week after a release before proposing it, so a compromised or
# yanked version has time to be caught before it reaches this repository.
version: 2
updates:
  - package-ecosystem: bundler
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      gems:
        patterns: ['*']
        update-types: [minor, patch]
    cooldown:
      default-days: 7
    labels: [skip-changelog]
    commit-message:
      prefix: chore(deps)
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    labels: [skip-changelog]
    commit-message:
      prefix: ci
