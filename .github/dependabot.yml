# Bundler updates arrive weekly as one pull request for minor and patch bumps; a major
# bump gets its own. Action SHAs are refreshed monthly, and Dependabot rewrites the version
# comment next to each SHA.
version: 2
updates:
  - package-ecosystem: bundler
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      gems:
        patterns: ['*']
        update-types: [minor, patch]
    commit-message:
      prefix: chore(deps)
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: ci
