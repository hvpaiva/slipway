# Publishes a tagged version to rubygems.org through trusted publishing (OIDC, no API key)
# and creates the GitHub release with the matching CHANGELOG.md section and the .gem file.
# The ci job runs the whole CI workflow on the tagged commit first, so nothing publishes
# that CI rejects. The verify job checks the tag and builds the gem outside any
# environment; only the publish job enters the release environment, and only when there is
# something to publish. A manual run defaults to a dry run: it verifies and builds, then
# stops. Publishing needs a tag ref, so a manual run from a branch never publishes,
# whatever dry_run says.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: Verify and build without publishing
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  # A reusable workflow call resolves before any step runs, so no runtime checkout can
  # change what "./" loads. zizmor prefers the "$/" self-repository form, which actionlint
  # 1.7.12 does not accept yet; switch once it does.
  ci:
    uses: ./.github/workflows/ci.yml # zizmor: ignore[self-repository]
    permissions:
      contents: read

  verify:
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      version: ${{ steps.verify.outputs.version }}
      publish: ${{ steps.decide.outputs.publish }}
    steps:
      # fetch-depth 0 brings every branch, so origin/main and origin/hotfix/* are available to
      # the ancestry check.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # Releases are cut from main, or from a hotfix/* branch for a fix to the latest release
      # (CONTRIBUTING.md, "Hotfixes and yanking"): a tag anywhere else never publishes.
      - name: Require the tagged commit to be on main or a hotfix branch
        if: github.ref_type == 'tag'
        run: |
          mapfile -t hotfixes < <(git for-each-ref --format='%(refname:short)' refs/remotes/origin/hotfix/)
          for branch in origin/main "${hotfixes[@]}"; do
            if git merge-base --is-ancestor "$GITHUB_SHA" "$branch"; then
              echo "$GITHUB_REF_NAME ($GITHUB_SHA) is on $branch"
              exit 0
            fi
          done
          echo "::error::$GITHUB_REF_NAME ($GITHUB_SHA) is on neither main nor a hotfix/* branch"
          exit 1
      # No bundler cache in this workflow: a cache written by another run must never feed a
      # release. BUNDLE_FROZEN installs exactly Gemfile.lock.
      - uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
      - name: Install the bundle
        env:
          BUNDLE_FROZEN: 'true'
        run: bundle install
      # The tag must be "v" + Slipway::VERSION and CHANGELOG.md must have a dated heading
      # for that version, the link references and an "## [Unreleased]" section. A manual
      # run from a branch skips the tag comparison. Writes version= to GITHUB_OUTPUT.
      - name: Verify the tag against Slipway::VERSION and CHANGELOG.md
        id: verify
        run: bundle exec rake release:verify
      # Building here, even on a dry run, catches a gemspec that no longer packages.
      - run: gem build slipway.gemspec
      - name: Decide whether this run publishes
        id: decide
        env:
          PUBLISH: ${{ github.ref_type == 'tag' && (github.event_name != 'workflow_dispatch' || !inputs.dry_run) }}
          VERSION: ${{ steps.verify.outputs.version }}
        run: |
          echo "publish=$PUBLISH" >> "$GITHUB_OUTPUT"
          echo "slipway $VERSION verified and built (publish: $PUBLISH)"

  publish:
    needs: verify
    if: needs.verify.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The rubygems.org trusted publisher is bound to this workflow file and this environment,
    # which only v* tags may enter.
    environment: release
    permissions:
      # id-token mints the OIDC token for rubygems.org. contents: write is for
      # gh release create only: rake release finds the tag already present and pushes nothing.
      id-token: write
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
      - name: Install the bundle
        env:
          BUNDLE_FROZEN: 'true'
        run: bundle install
      # release-gem runs "bundle exec rake release": build into pkg/, skip tagging because
      # the tag already exists, then push pkg/*.gem with the OIDC credential. await-release is
      # off because it runs "gem exec rubygems-await", an unpinned download executed while the
      # rubygems.org credential is on disk, and nothing after this step waits for the index.
      - name: Publish to rubygems.org
        uses: rubygems/release-gem@7f9650160c1a4e7989fdc9855807bdbd421d8b6b # v1.4.1
        with:
          await-release: false
      # The release notes are the CHANGELOG.md section for this version, from its heading up
      # to the next "## " heading or the link references at the end of the file. The attached
      # .gem is the file that was just pushed; gh uploads it to a draft and publishes after,
      # which immutable releases require.
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          ruby -e '
            lines = File.readlines("CHANGELOG.md")
            start = lines.index { |line| line.start_with?("## [#{ARGV[0]}] - ") } or abort "no section for #{ARGV[0]}"
            body = lines[(start + 1)..].take_while { |line| !line.start_with?("## ") && !line.match?(/\A\[[^\]]+\]: /) }
            File.write("notes.md", "#{body.join.strip}\n")
          ' "$VERSION"
          gh release create "$TAG" --verify-tag --title "$TAG" --notes-file notes.md "pkg/slipway-$VERSION.gem"
